<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIM Owner Studio</title><link rel="stylesheet" href="/admin.css?v=5"></head><body>
<header><img src="/assets/grim-primary.png" alt="GRIM"><div><b>OWNER STUDIO</b><small>Product & order management</small></div><a href="/shop.html">VIEW STORE ↗</a></header>
<main><section id="login" class="panel login"><p class="eyebrow">PRIVATE ACCESS</p><h1>GRIM OWNER STUDIO</h1><p>Manage products without editing code.</p><form id="loginForm"><input id="password" type="password" required placeholder="Admin password"><button>SIGN IN</button><p id="loginMsg"></p></form></section>
<section id="dash" hidden><div class="hero"><div><p class="eyebrow">GRIM CONTROL</p><h1>STORE MANAGER</h1></div><button class="ghost" id="logout">LOG OUT</button></div>
<div class="tabs"><button data-tab="products" class="active">PRODUCTS</button><button data-tab="orders">ORDERS</button></div>
<div id="productsTab"><section class="panel"><h2>ADD PRODUCT</h2><form id="addForm" class="grid" enctype="multipart/form-data"><input name="name" required placeholder="Colorway name — e.g. Veil"><select name="type" required><option>Hoodie</option><option>Tee</option><option>Armless</option><option>Complete GRIM Outfit</option><option>Sweat Jacket</option></select><input name="color" required placeholder="Color — e.g. White"><input name="price" required type="number" min="0" placeholder="Price in ₦"><input name="sort_order" type="number" value="100" placeholder="Display order"><label class="file">PRODUCT IMAGE<input name="image" type="file" accept="image/*"></label><button class="wide">ADD TO STORE</button><p id="addMsg"></p></form></section><section><div class="section-title"><h2>LIVE CATALOG</h2><span id="productCount"></span></div><div id="productList" class="cards"></div></section></div>
<div id="ordersTab" hidden><section><div class="section-title"><h2>RECENT ORDERS</h2></div><div id="orders" class="orders"></div></section></div>
</section></main><script src="/admin.js?v=6"></script></script><a href="/grim-admin/shipping.html">Shipping measurements &amp; receipts</a></body></html>
