<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRIM Customer Care</title><style>body{margin:0;background:#080808;color:#eee;font-family:Arial,sans-serif}main{max-width:760px;margin:auto;padding:28px 20px 80px}a{color:inherit}.brand{letter-spacing:.3em;font-weight:800}.card{border:1px solid #333;background:#111;padding:24px;margin-top:28px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;background:#0b0b0b;color:#eee;border:1px solid #444}textarea{min-height:160px}button{background:#eee;color:#111;font-weight:800}.status{min-height:24px}.back{display:inline-block;margin-bottom:25px}</style></head><body><main><a class="back" href="/">← Back to GRIM</a><div class="brand">GRIM</div><h1>Customer Care</h1><p>Tell us what happened. Your message is saved as a support ticket so the GRIM team can follow it up.</p><div class="card"><form id="support"><select name="topic" required><option value="">Choose a topic</option><option>Order</option><option>Delivery</option><option>Payment</option><option>Wallet</option><option>Product / Size</option><option>Return / Exchange</option><option>Account</option><option>Other</option></select><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required><input name="order" placeholder="Order reference (optional)"><textarea name="message" placeholder="How can GRIM help?" required></textarea><button>SEND TO GRIM</button></form><p class="status"></p></div></main><script>document.querySelector('#support').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('.status'),f=new FormData(e.target),body=Object.fromEntries(f.entries());s.textContent='Sending…';try{const r=await fetch('/api/support',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),b=await r.json();if(!r.ok)throw new Error(b.error||'Unable to send');s.textContent='Message sent. Ticket #'+b.ticketId;e.target.reset()}catch(x){s.textContent=x.message}}</script></body></html>
